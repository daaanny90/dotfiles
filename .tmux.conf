################################################################################
# BASIC SETTINGS
################################################################################

# Change prefix from C-b to C-a
unbind C-b
set -g prefix C-a

# Enable mouse support
set -g mouse on

# Remove delay when hitting escape
set -s escape-time 0

# Allow passthrough for synchronized output (DEC 2026 - reduces flicker)
set -g allow-passthrough on

# Enable focus events (lets apps know when pane gains/loses focus)
set -g focus-events on

# Enable extended keys for modifier key support
set -g extended-keys on

# Increase scrollback for high-frequency output (Claude Code streams ~5k events/sec)
set -g history-limit 250000

# Renumber windows when one is closed
set -g renumber-windows on

# Let tmux automatically set window names based on running program
set -g automatic-rename on
set -g automatic-rename-format '#W'

# Don't allow programs to change window name
set -g allow-rename off

# Keep TERM_PROGRAM fresh on client reattach (required by TokenEater to detect terminal)
set -ga update-environment "TERM_PROGRAM"

# Enable UTF-8 support for proper unicode character rendering
set -gq utf8 on
set -gq status-utf8 on

################################################################################
# TERMINAL AND COLOR SUPPORT (iTerm2 + Nerd Fonts)
################################################################################

# Use tmux-256color for proper color and font support
set -g default-terminal "tmux-256color"

# Tell tmux that the outer terminal supports true color (any TERM type)
# Critical for Cursor CLI, diff colors, prompts - matches iTerm2 when outside tmux
set -as terminal-overrides ',*:Tc'
set -as terminal-overrides ',*:RGB'

# Legacy overrides for xterm-256color (backup)
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",xterm-256color:RGB"

# Support for italics
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# Support for undercurl (curly underlines)
set -as terminal-overrides ',xterm*:Smulx=\E[4::%p1%dm'

# Support for colored undercurls
set -as terminal-overrides ',xterm*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

################################################################################
# KEY BINDINGS
################################################################################

# Reload configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Split windows with | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Switch panes using hjkl
bind h select-pane -L
bind l select-pane -R
bind j select-pane -U
bind k select-pane -D

# Maximize current pane
bind -r m resize-pane -Z

################################################################################
# VIM-TMUX NAVIGATOR INTEGRATION
################################################################################

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

################################################################################
# WINDOW AND PANE NUMBERING
################################################################################

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
set -g pane-base-index 1

################################################################################
# STATUS BAR CONFIGURATION
################################################################################

# Status bar position (top)
set -g status-position top

# Refresh status line every 5 seconds
set -g status-interval 5

################################################################################
# THEME SELECTION
# To change theme, edit: ~/.config/tmux/theme-choice.tmux
################################################################################
source-file ~/.config/tmux/theme-choice.tmux

################################################################################
# PLUGINS (tpm) — install with prefix+I, update with prefix+U
################################################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

# Initialize tpm (must stay at the very bottom of this file)
run '~/.tmux/plugins/tpm/tpm'
