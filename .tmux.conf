################################################################################
# BASIC SETTINGS
################################################################################

# Change prefix from C-b to C-a
unbind C-b
set -g prefix C-a

# Enable mouse support
set -g mouse on

# Remove delay when hitting escape
set -s escape-time 0

# Allow passthrough for synchronized output (DEC 2026 - reduces flicker)
set -g allow-passthrough on

# Enable focus events (lets apps know when pane gains/loses focus)
set -g focus-events on

# Enable extended keys for modifier key support
set -g extended-keys on

# Increase scrollback for high-frequency output (Claude Code streams ~5k events/sec)
set -g history-limit 250000

# Renumber windows when one is closed
set -g renumber-windows on

# When the attached session dies, switch the client to the previous session
# instead of detaching — killing a wt-* worktree session lands you back where
# you came from (e.g. herole) instead of dropping you out of tmux.
set -g detach-on-destroy off

# Exception: claude-* popup sessions (the plugin's prefix+y flow) must still
# detach their nested popup client when Claude exits, so the popup closes.
# The hook script flags every claude-* session with detach-on-destroy on.
set-hook -g session-created 'run-shell -b "~/.config/tmux/scripts/claude-popup-flag.sh"'

# Let tmux automatically set window names based on running program
set -g automatic-rename on
set -g automatic-rename-format '#W'

# Don't allow programs to change window name
set -g allow-rename off

# Enable UTF-8 support for proper unicode character rendering
set -gq utf8 on
set -gq status-utf8 on

################################################################################
# TERMINAL AND COLOR SUPPORT (iTerm2 + Nerd Fonts)
################################################################################

# Use tmux-256color for proper color and font support
set -g default-terminal "tmux-256color"

# Tell tmux that the outer terminal supports true color (any TERM type)
# Critical for Cursor CLI, diff colors, prompts - matches iTerm2 when outside tmux
set -as terminal-overrides ',*:Tc'
set -as terminal-overrides ',*:RGB'

# Legacy overrides for xterm-256color (backup)
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",xterm-256color:RGB"

# Support for italics
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# Support for undercurl (curly underlines)
set -as terminal-overrides ',xterm*:Smulx=\E[4::%p1%dm'

# Support for colored undercurls
set -as terminal-overrides ',xterm*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Ghostty: tmux 3.5a doesn't detect its features (iTerm2 gets them via XTVERSION)
set -as terminal-features ',xterm-ghostty:256:RGB:extkeys:hyperlinks:sync:usstyle:strikethrough:osc7'

################################################################################
# KEY BINDINGS
################################################################################

# Reload configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Split windows with | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Switch panes using hjkl
bind h select-pane -L
bind l select-pane -R
bind j select-pane -U
bind k select-pane -D

# Maximize current pane
bind -r m resize-pane -Z

################################################################################
# VIM-TMUX NAVIGATOR INTEGRATION
################################################################################

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

################################################################################
# WINDOW AND PANE NUMBERING
################################################################################

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
set -g pane-base-index 1

################################################################################
# STATUS BAR CONFIGURATION
################################################################################

# Status bar position (top)
set -g status-position top

# Refresh status line every 5 seconds
set -g status-interval 5

################################################################################
# THEME SELECTION
# To change theme, edit: ~/.config/tmux/theme-choice.tmux
################################################################################
source-file ~/.config/tmux/theme-choice.tmux

# The claude agent's state beside each window's name (⏳ asks you something,
# 🔨 works, ✓ your turn), kept by gig notify from Claude Code's hooks. When it
# asks you something or finishes, gig notify also rings the window's bell:
# tmux marks that window until you go there. No beep and no bell in the window
# you look at: the notification has its own sound.
run-shell "~/.config/tmux/scripts/gig-window-state.sh"
set -g bell-action other
set -g visual-bell on

# prefix+b: gig's sidebar, the session's windows on the left (state, ticket,
# tag) instead of the status bar; a click goes to a window. One pane per
# session that follows you: these hooks move it into the window you go to and
# tell it to draw again, the last line in a new theme's colours. Fixed indexes:
# sourcing this file again adds nothing.
# The move itself is tmux's own, here, before the window is drawn: gig a moment
# later would show it without the sidebar first, a flash. Only when the pane is
# in the session and not in this window ("on" while it starts would name a
# window). 32 is gig's SIDEBAR_WIDTH. gig --follow still makes it again when it
# went with a window and closes a window it is alone in.
bind b run-shell -b "~/.local/bin/gig sidebar --toggle '#{session_id}'"
set-hook -g 'session-window-changed[90]' {
  if -F '#{&&:#{W:#{P:#{?#{==:#{pane_id},#{@gig_sidebar}},x,}}},#{==:#{P:#{?@gig_sidebar_pane,x,}},}}' {
    run-shell -C "join-pane -d -f -h -b -l #{?@gig_sidebar_width,#{@gig_sidebar_width},32} -s '#{@gig_sidebar}' -t '#{window_id}'"
    wait-for -S gig-sidebar
  }
  run-shell -b "~/.local/bin/gig sidebar --follow '#{session_id}'"
}
set-hook -g 'pane-exited[90]' { run-shell -b "~/.local/bin/gig sidebar --follow '#{session_id}'" }
set-hook -g 'window-linked[90]' { wait-for -S gig-sidebar }
set-hook -g 'window-unlinked[90]' { wait-for -S gig-sidebar }
set-hook -g 'window-renamed[90]' { wait-for -S gig-sidebar }
set-hook -g 'alert-bell[90]' { wait-for -S gig-sidebar }
# a session you went to clears its window's bell: its row stops showing an end
set-hook -g 'client-session-changed[90]' { wait-for -S gig-sidebar }
wait-for -S gig-sidebar

################################################################################
# PLUGINS (tpm) — install with prefix+I, update with prefix+U
################################################################################
# Options for the plugin's own Claude picker (prefix+C-u). Vim-style nav mode:
# j/k move, q close, x kill agent, i/a switch to fuzzy-filter, esc back to nav
# --preview-window right,60%,follow: list on the left, live preview on the right
# (overrides the built-in up,70% stacked layout)
set -g @claude_fzf_options "\
  --prompt 'nav> ' \
  --preview-window 'right,60%,follow' \
  --bind 'j:down' \
  --bind 'k:up' \
  --bind 'q:abort' \
  --bind 'x:execute-silent(kill {3})+reload(sleep 0.3; \$CLAUDE_PICKER --list)' \
  --bind 'i:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'a:unbind(j,k,q,i,a,x)+change-prompt(filter> )' \
  --bind 'esc:rebind(j,k,q,i,a,x)+change-prompt(nav> )'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

# prefix+Y: open Claude in a real left-docked sidebar pane (persistent split,
# resizes surrounding panes). Separate from the plugin's prefix+y session popup.
# nvim (claudecode.nvim, provider=none) connects to it via /ide.
bind Y split-window -hb -l 30% -c "#{pane_current_path}" claude

# prefix+W: fzf-pick a local branch (most-recent first) or type a new name to
# create one, put it in a git worktree, and open its wt-* session with three
# windows: claude, edit (nvim), git (lazygit). The client is SWITCHED there.
bind W run-shell "~/.config/tmux/scripts/new-worktree.sh --popup '#{q:client_name}' '#{q:pane_current_path}'"

# The agents' overview is gig's ticket list (prefix+t). The plugin's own
# popup-attach picker stays on prefix+C-u, off the plain u it would take.
set -g @claude_list_key 'C-u'

# prefix+g: lazygit popup on the current pane's repo
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit

# prefix+X: kill the current session; with detach-on-destroy off you land back
# in the previous one (e.g. herole) instead of out of tmux.
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# prefix+t: gig (~/lab/gig/bin/gig) asks for a ticket and an action
# (work, review, answer, close, /command) and opens its claude window here.
# t was tmux's clock (clock-mode), never used here.
bind t display-popup -E -b rounded -T " gig " -w 80% -h 60% -d "#{pane_current_path}" "~/.local/bin/gig"

# prefix+u: the session's tickets with their links (gig links), the current
# window's first: t opens the ticket in the browser, m its merge request, enter
# both.
bind u display-popup -E -b rounded -T " gig " -w 80% -h 50% "~/.local/bin/gig links"

# Initialize tpm (must stay at the very bottom of this file)
run '~/.tmux/plugins/tpm/tpm'
