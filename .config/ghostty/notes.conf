# Ghostty window for the "notes" Neovim profile (~/.config/notes).
# Loaded only by the `notes` shell function, with --config-default-files=false.

font-family = iMWritingMono Nerd Font Mono
font-size = 16
adjust-cell-height = 25%

# zed-macos-classic-dark is transparent in nvim, so the window paints the paper
background = #131313
foreground = #dddddd

window-width = 100
window-height = 40
window-padding-x = 24
window-padding-y = 16
window-padding-balance = true
macos-titlebar-style = transparent
title = notes

quit-after-last-window-closed = true
confirm-close-surface = false
window-save-state = never
